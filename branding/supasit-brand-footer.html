<!--
  A(i)CODER brand footer — reusable drop-in snippet.
  D1 "Neon Arcade" bare mark (pixel-glyph wordmark, not a font) from
  claude-config/branding, source of truth for the mark's geometry and
  colours. "(i)" is recoloured to #FF5C8A (brand year-mark pink) against
  the rest of the wordmark's #B39DF3 violet, so the AI reading pops out
  of the name.

  HOW TO USE IN A NEW APP:
  1. Copy the <style> block below into your app's <head> (or merge the
     rules into your existing stylesheet) — only the `.brand-footer` and
     `.brand-footer svg` layout rules are actually required; the .tube/
     .tube-s/.tube-b/@keyframes rules are duplicated here for reference
     only. The SVG below embeds its own copy of those animation rules in
     an internal <style>, so the flicker still runs even if this outer
     block is skipped entirely — that's exactly the bug that shipped to
     OmniShift-Ledger's index.html (layout rules got copied, animation
     rules didn't, so the mark rendered static). Don't repeat that: keep
     the SVG's internal <style> intact if you ever hand-edit this snippet.
  2. Copy the <div class="brand-footer">...</div> markup so it sits right
     before your closing </body> tag.
  3. By default this pins itself to the very bottom of the viewport
     (`bottom: 0`). If your app already has its own fixed bottom nav/toolbar,
     change the one line `bottom: 0;` in `.brand-footer` to
     `bottom: <your-nav-height>;` (e.g. `bottom: 60px;`) so the two don't
     overlap, and add that same height to your page's bottom padding.
  4. No external fonts, images, or network requests required — the SVG
     (including its flicker keyframes) is fully self-contained, which is
     what lets it animate even when dropped into a strict-CSP page.
  5. Brand ground: this mark is D1 — it must only ever sit on a light
     surface (lighter than #E8E4F2). If your app has a dark theme, pin the
     footer's background to a fixed light colour (as done here, #F7F5FB —
     the D1 "paper" token) rather than letting it follow the app's theme
     variable, since D1 must never sit on a dark ground. For a dark-themed
     app, use the D2 "CRT Night" direction from the same branding kit
     instead of forcing D1 onto a dark surface.
-->
<style>
.brand-footer {
  position: fixed; left: 0; right: 0; bottom: 0; /* adjust bottom offset if you have a bottom nav */
  height: 68px;
  background: #F7F5FB;
  border-top: 1px solid #E5E7EB;
  display: flex; align-items: center; justify-content: center;
  z-index: 25;
}
.brand-footer svg { display: block; height: 56px; width: auto; }
.tube   { animation: sc-warm 2.6s steps(1, end) var(--wd, 0s) 1 both; }
.tube-s { animation: sc-stut var(--sp, 13s) steps(1, end) var(--sd, 0s) infinite; }
.tube-b { animation: sc-breathe var(--bp, 6s) ease-in-out var(--bd, 0s) infinite; }
@keyframes sc-warm {
0%   { opacity: 0; }
3%   { opacity: 1; }
6%   { opacity: .06; }
10%  { opacity: .85; }
13%  { opacity: 0; }
21%  { opacity: 1; }
25%  { opacity: .1; }
28%  { opacity: 1; }
32%  { opacity: .35; }
36%  { opacity: 1; }
41%  { opacity: .15; }
46%  { opacity: 1; }
100% { opacity: 1; }
}
/* Lit at 0% so a cancelled animation leaves the sign on. */
@keyframes sc-stut {
0%, 95.6%   { opacity: 1; }
96%         { opacity: .07; }
96.4%       { opacity: 1; }
97.2%       { opacity: .14; }
97.6%, 100% { opacity: 1; }
}
@keyframes sc-breathe {
0%, 100% { opacity: 1; }
50%      { opacity: .87; }
}
@media (prefers-reduced-motion: reduce) {
.tube, .tube-s, .tube-b { animation: none; opacity: 1; }
}
</style>
