<!--
  SOICODER brand footer — reusable drop-in snippet.
  Paw+flag lockup mark (viewBox 0 0 120 130, back paw purple / front paw
  pink) + VT323 wordmark "SOICODER 2025", Dracula purple/pink with glow.

  HOW TO USE IN A NEW APP:
  1. Add the VT323 font (Google Fonts) — either a <link> tag in <head>:
       <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
     or the @import shown in the <style> block below. If your app has a
     Content-Security-Policy, allow style-src/font-src for
     fonts.googleapis.com / fonts.gstatic.com.
  2. Copy the <style> block below into your app's <head> (or merge the
     rules into your existing stylesheet).
  3. Copy the <div class="brand-footer">...</div> markup so it sits right
     before your closing </body> tag.
  4. By default this pins itself to the very bottom of the viewport
     (`bottom: 0`). If your app already has its own fixed bottom nav/toolbar,
     change the one line `bottom: 0;` in `.brand-footer` to
     `bottom: <your-nav-height>;` (e.g. `bottom: 60px;`) so the two don't
     overlap, and add that same height to your page's bottom padding.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

.brand-footer {
  position: fixed; left: 0; right: 0; bottom: 0; /* adjust bottom offset if you have a bottom nav */
  height: 46px;
  background: #FFFFFF;
  border-top: 1px solid #E5E7EB;
  display: flex; align-items: center; justify-content: center;
  z-index: 25;
}
.soicoder-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'VT323', ui-monospace, monospace;
  animation: soicoder-flicker 4.2s infinite ease-in-out;
}
.soicoder-mark {
  width: 32px;
  height: 35px;
  flex-shrink: 0;
  filter: drop-shadow(0 0 3px #BD93F9) drop-shadow(0 0 3px #FF79C6) drop-shadow(0 0 8px rgba(189,147,249,.4));
}
.soicoder-word {
  font-size: 1.35rem;
  letter-spacing: .02em;
  color: #BD93F9;
  text-shadow: 0 0 6px rgba(189,147,249,.75), 0 0 16px rgba(189,147,249,.5), 0 0 30px rgba(189,147,249,.25);
}
.soicoder-word small {
  font-size: .55em;
  letter-spacing: .06em;
  color: #FF79C6;
  text-shadow: 0 0 6px rgba(255,121,198,.7), 0 0 14px rgba(255,121,198,.4);
  margin-left: 5px;
  vertical-align: middle;
}
@keyframes soicoder-flicker {
  0%, 4%, 8%, 100% { opacity: 1; }
  5% { opacity: .45; }
  6% { opacity: 1; }
  47% { opacity: 1; }
  48% { opacity: .6; }
  49% { opacity: 1; }
  74% { opacity: 1; }
  75% { opacity: .7; }
  76% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .soicoder-badge { animation: none; }
}
</style>

<div class="brand-footer">
  <div class="soicoder-badge">
    <svg class="soicoder-mark" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="32" cy="88" rx="13" ry="10" fill="#BD93F9"/>
      <circle cx="18" cy="72" r="5.2" fill="#BD93F9"/>
      <circle cx="27" cy="62" r="5.5" fill="#BD93F9"/>
      <circle cx="38" cy="62" r="5.5" fill="#BD93F9"/>
      <circle cx="47" cy="73" r="5.2" fill="#BD93F9"/>
      <ellipse cx="80" cy="50" rx="14" ry="11" fill="#FF79C6"/>
      <circle cx="63" cy="33" r="5.6" fill="#FF79C6"/>
      <circle cx="73" cy="22" r="5.8" fill="#FF79C6"/>
      <circle cx="85" cy="22" r="5.8" fill="#FF79C6"/>
      <circle cx="95" cy="34" r="5.6" fill="#FF79C6"/>
      <rect x="6" y="108" width="108" height="6.7" fill="#FF5555"/>
      <rect x="6" y="114.7" width="108" height="6.7" fill="#F8F8F2"/>
      <rect x="6" y="121.4" width="108" height="6.6" fill="#2B3AA0"/>
    </svg>
    <span class="soicoder-word">SOICODER<small>2025</small></span>
  </div>
</div>
